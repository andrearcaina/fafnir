services:
    prometheus:
        image: prom/prometheus:latest
        container_name: fafnir-prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        ports:
            - "9090:9090"
        restart: unless-stopped
        volumes:
            - ../../infra/monitoring/prometheus:/etc/prometheus
            - prom_data:/prometheus
        networks:
            - fafnir-network

    grafana:
        image: grafana/grafana:latest
        container_name: fafnir-grafana
        ports:
            - "3000:3000"
        restart: unless-stopped
        environment:
            GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASS:-admin}
            GF_USERS_ALLOW_SIGN_UP: false
        volumes:
            - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
            - ../../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
            - grafana_data:/var/lib/grafana
        networks:
            - fafnir-network
        depends_on:
            - prometheus

    loki:
        image: grafana/loki:latest
        container_name: fafnir-loki
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/local-config.yaml
        networks:
            - fafnir-network

    alloy:
        image: grafana/alloy:latest
        container_name: fafnir-alloy
        volumes:
            - ../../infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
        command:
            - run
            - /etc/alloy/config.alloy
        networks:
            - fafnir-network
        depends_on:
            - loki

volumes:
    prom_data:
        driver: local
    grafana_data:
        driver: local

networks:
    fafnir-network:
        driver: bridge
